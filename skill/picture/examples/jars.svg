<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 290" role="img"><title>Three jars of hours</title><desc>Three week jars, each holding four blocks of five hours, add up to sixty hours.</desc><style>text{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif}</style><rect x="0" y="0" width="680" height="290" rx="8" fill="#FFFFFF"/><text x="40" y="34" font-size="13" fill="#5B6673">1 block = 5 hours</text><path d="M40 60 L40 220 Q40 228 48 228 L132 228 Q140 228 140 220 L140 60" fill="none" stroke="#5B6673" stroke-width="1.5"/><rect x="48" y="186" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="48" y="146" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="48" y="106" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="48" y="66" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><text x="90" y="252" font-size="14" font-weight="500" fill="#1B2430" text-anchor="middle">Week 1</text><text x="90" y="272" font-size="13" fill="#5B6673" text-anchor="middle">20 h</text><path d="M170 60 L170 220 Q170 228 178 228 L262 228 Q270 228 270 220 L270 60" fill="none" stroke="#5B6673" stroke-width="1.5"/><rect x="178" y="186" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="178" y="146" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="178" y="106" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="178" y="66" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><text x="220" y="252" font-size="14" font-weight="500" fill="#1B2430" text-anchor="middle">Week 2</text><text x="220" y="272" font-size="13" fill="#5B6673" text-anchor="middle">20 h</text><path d="M300 60 L300 220 Q300 228 308 228 L392 228 Q400 228 400 220 L400 60" fill="none" stroke="#5B6673" stroke-width="1.5"/><rect x="308" y="186" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="308" y="146" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="308" y="106" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><rect x="308" y="66" width="84" height="36" rx="3" fill="#D9A441" stroke="#9A6E1E" stroke-width="0.8"/><text x="350" y="252" font-size="14" font-weight="500" fill="#1B2430" text-anchor="middle">Week 3</text><text x="350" y="272" font-size="13" fill="#5B6673" text-anchor="middle">20 h</text><line x1="440" y1="60" x2="440" y2="228" stroke="#D5D9DF" stroke-dasharray="3 3"/><text x="470" y="120" font-size="14" fill="#5B6673">3 jars × 4 blocks</text><text x="470" y="150" font-size="14" fill="#5B6673">= 12 blocks × 5 h</text><text x="470" y="200" font-size="40" font-weight="500" fill="#1B2430">60 hours</text></svg>